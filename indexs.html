<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <script defer src="scripts.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 90%;
            max-width: 400px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        .chat-header {
            background: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2em;
        }
        .chat-box {
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            background: #fff;
        }
        .chat-box ul {
            list-style: none;
        }
        .chat-box li {
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            max-width: 75%;
            word-wrap: break-word;
        }
        .chat-box .user {
            background: #007bff;
            color: white;
            align-self: flex-end;
            text-align: right;
        }
        .chat-box .other {
            background: #ddd;
            text-align: left;
        }
        .chat-input {
            display: flex;
            border-top: 1px solid #ddd;
            padding: 10px;
            background: white;
        }
        .chat-input input {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
            font-size: 1em;
            border-radius: 5px;
        }
        .chat-input button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            margin-left: 10px;
        }
        .chat-input button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">💬 Real-Time Chat</div>
        <div class="chat-box">
            <ul id="messages"></ul>
        </div>
        <div class="chat-input">
            <input id="message" type="text" placeholder="Type a message..." autocomplete="off">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</body>
</html>
